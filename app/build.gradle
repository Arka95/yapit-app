plugins { id 'com.android.application' }

def escapedProp = { String name ->
    String value = providers.gradleProperty(name).orElse("").get()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.example.yapit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.yapit'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'VOICE_API_BASE_URL', escapedProp('VOICE_API_BASE_URL')
        buildConfigField 'String', 'VOICE_API_KEY', escapedProp('VOICE_API_KEY')
    }

    buildFeatures { buildConfig true }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/modelAssets')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation files('libs/sherpa-onnx-2.0.3.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def pocketModelDirectory = rootProject.file('data/models/sherpa-onnx-pocket-tts-int8-2026-01-26')
def pocketFiles = ['lm_flow.int8.onnx', 'lm_main.int8.onnx', 'encoder.onnx', 'decoder.int8.onnx',
                   'text_conditioner.onnx', 'vocab.json', 'token_scores.json', 'LICENSE', 'README.md']
def preparePocketModelAssets = tasks.register('preparePocketModelAssets', Sync) {
    from(pocketModelDirectory) { include pocketFiles }
    into layout.buildDirectory.dir('generated/modelAssets/models/pocket-tts-int8-2026-01-26')
    doFirst {
        pocketFiles.each { name ->
            if (!new File(pocketModelDirectory, name).isFile()) {
                throw new GradleException("Missing Pocket TTS file ${name}. Run scripts\\setup-model.ps1 first.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn preparePocketModelAssets }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
